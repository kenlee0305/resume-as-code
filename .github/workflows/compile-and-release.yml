name: Compile LaTeX and Release PDF

on:
  push:
    branches:
      - main
    paths:
      - resume.tex
      - resume.cls
  pull_request:

jobs:
  build_latex:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Set up Git repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install poppler-utils
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - name: Create legacy directory
        run: mkdir -p legacy

      - name: Create legacy PDF (if exists)
        run: |
          if [ -f Lee-Ka-Chun_Resume.pdf ]; then
            cp Lee-Ka-Chun_Resume.pdf "./legacy/Lee-Ka-Chun_Resume_$(date +%d)_$(date +%m)_$(date +%Y).pdf"
          fi

      - name: Compile LaTeX document
        uses: xu-cheng/latex-action@v3
        with:
          root_file: resume.tex
          latexmk_use_xelatex: true
          latexmk_shell_escape: true
          extra_system_packages: |
            msttcorefonts-installer
            fontconfig
          pre_compile: |
            update-ms-fonts
            fc-cache -fv
          args: -pdf -interaction=nonstopmode -halt-on-error -jobname=Lee-Ka-Chun_Resume

      - name: Convert PDF to PNG
        run: pdftoppm -png -singlefile -r 300 Lee-Ka-Chun_Resume.pdf Lee-Ka-Chun_Resume-1

      - name: Rename PNG file
        run: |
          if [ -f Lee-Ka-Chun_Resume.png ]; then
            rm Lee-Ka-Chun_Resume.png
          fi
          mv Lee-Ka-Chun_Resume-1.png Lee-Ka-Chun_Resume.png

      - name: Configure Git
        run: |
          git config --global user.name 'Ken Lee'
          git config --global user.email 'leekachun5a16@gmail.com'

      - name: Commit and push compiled files
        run: |
          git add Lee-Ka-Chun_Resume.pdf Lee-Ka-Chun_Resume.png
          git add legacy/
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update resume [skip ci]"
            git push
          fi

      - name: Create Release
        if: success()
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ github.run_number }}
          name: Release ${{ github.run_number }}
          draft: false
          prerelease: false
          files: Lee-Ka-Chun_Resume.pdf